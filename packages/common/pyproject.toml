[project]
name = "creativo-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
