[project]
name = "creativo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "creativo-common",
  "creativo-contracts",
  "creativo-db",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pillow>=11",
  "python-multipart>=0.0.18",
  "redis>=5.2",
  "uvicorn>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
