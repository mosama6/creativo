name: creativo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creativo
      POSTGRES_PASSWORD: creativo
      POSTGRES_DB: creativo
    ports:
      - "5433:5432"
    volumes:
      - creativo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creativo -d creativo"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  creativo_pg:
