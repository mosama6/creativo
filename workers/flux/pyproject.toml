[project]
name = "creativo-flux"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.2",
  "creativo-common",
  "creativo-contracts",
  "diffusers>=0.35",
  "fastapi>=0.115",
  "gguf>=0.10",
  "huggingface-hub>=0.26",
  "pillow>=11",
  "protobuf>=5",
  "redis>=5.2",
  "sentencepiece>=0.2",
  "torch>=2.6",
  "transformers>=4.46",
  "uvicorn>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
